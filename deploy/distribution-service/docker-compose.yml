# Map E L1 — local / ECS single-node Distribution Service
# Usage (from repo root):
#   cp deploy/distribution-service/.env.example deploy/distribution-service/.env
#   docker compose -f deploy/distribution-service/docker-compose.yml up -d --build
#   curl http://127.0.0.1:4040/health

services:
  distribution:
    build:
      context: ../..
      dockerfile: deploy/distribution-service/Dockerfile
    image: client-platform/distribution-service:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${DISTRIBUTION_PORT:-4040}:4040"
    environment:
      RN_CP_PROJECT: /data/project
      RN_CP_HOST: 0.0.0.0
      PORT: "4040"
      RN_CP_TOKEN: ${RN_CP_TOKEN:-}
      RN_CP_ROLE: ${RN_CP_ROLE:-admin}
      RN_CP_REGISTRY: ${RN_CP_REGISTRY:-sqlite}
      RN_CP_DISABLE_CONSOLE: ${RN_CP_DISABLE_CONSOLE:-0}
      # 多租户契约：当前是单值 token（RN_CP_TOKEN），per-tenant 隔离走
      # RN_CP_DATABASE_URL → Postgres adapter（见 .env.example 注释）。
      RN_CP_DATABASE_URL: ${RN_CP_DATABASE_URL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4040/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - distribution-data:/data/project

  # NOT part of the rn platform's release chain: an optional, read-only Python
  # backend that lives in its OWN repo (~/code/data-service) and serves the
  # business offline packages. It used to be a DEFAULT service here, with a
  # repo-relative build context (`../../data-service`) that has never existed in
  # this repository — so the command documented at the top of this file and
  # `scripts/verify-distribution-compose.mjs` could not run on a clean checkout:
  #   unable to prepare context: path ".../data-service" not found
  # Opt in explicitly, as the docs always intended ("只随 compose 可选编排"):
  #   DATA_SERVICE_CONTEXT=~/code/data-service \
  #     docker compose --profile data-service up -d --build
  data-service:
    profiles: ["data-service"]
    image: client-platform/data-service:local
    build:
      context: ${DATA_SERVICE_CONTEXT:-${HOME}/code/data-service}
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${DATA_SERVICE_PORT:-8001}:8001"
    environment:
      API_KEY: ${DATA_SERVICE_API_KEY:-}
    volumes:
      # `${HOME}/...`, not `~/...`: Compose does not expand a leading `~`, so the
      # old form created a literal `~` directory under the compose project.
      - ${STOCK_SCREENER_DATA:-${HOME}/code/stock-screener/data}:/root/code/stock-screener/data
      - ${DASHBOARD_DATA:-${HOME}/code/dashboard/data}:/root/code/dashboard/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/v1/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  distribution-data:
