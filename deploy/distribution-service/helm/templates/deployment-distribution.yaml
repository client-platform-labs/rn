apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "distribution-service.fullname" . }}-distribution
  labels:
    {{- include "distribution-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.distribution.replicas }}
  selector:
    matchLabels:
      {{- include "distribution-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distribution-service.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: distribution
          image: "{{ .Values.distribution.image.repository }}:{{ .Values.distribution.image.tag }}"
          imagePullPolicy: {{ .Values.distribution.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.distribution.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "distribution-service.fullname" . }}-distribution-env
          env:
            - name: RN_CP_PROJECT
              value: /data/project
          volumeMounts:
            - name: data
              mountPath: /data/project
          {{- with .Values.resources.distribution }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.distribution.healthcheck.path }}
              port: {{ .Values.distribution.healthcheck.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.distribution.healthcheck.path }}
              port: {{ .Values.distribution.healthcheck.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          {{- if .Values.distribution.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "distribution-service.fullname" . }}-distribution-data
          {{- else }}
          emptyDir: {}
          {{- end }}