{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "distribution-service.fullname" . }}
  labels:
    {{- include "distribution-service.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "distribution-service.fullname" . }}
                port:
                  name: distribution
    - host: {{ .Values.ingress.stagingHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "distribution-service.fullname" . }}
                port:
                  name: distribution
{{- end }}