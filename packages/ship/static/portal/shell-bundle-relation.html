  <script>
/**
 * Dependency model (prototype) — industrial handling without giant graphs.
 *
 * Shell→Bundle: capability contract (fingerprint, shellMin, nativeApis⊇nativeDeps)
 * Bundle→Bundle: rarely direct JS import across OTA packages (ADR-007).
 *   Instead: peer version ranges on same host, shared contract packages,
 *   or soft "works better with" hints. Hard deps on another business_module
 *   OTA digest are discouraged; prefer shell bus + capability APIs.
 */

const STRENGTH = { hard: "hard", peer: "peer", soft: "soft" };

function semverGte(label, min) {
  const m = label.match(/(\d+\.\d+\.\d+)/);
  if (!m) return true;
  const a = m[1].split(".").map(Number);
  const b = min.split(".").map(Number);
  for (let i = 0; i < 3; i++) {
    if ((a[i] || 0) > (b[i] || 0)) return true;
    if ((a[i] || 0) < (b[i] || 0)) return false;
  }
  return true;
}

function shellBundleCompat(shell, bundle) {
  const reasons = [];
  if (shell.runtimeLine !== bundle.runtimeLine) {
    reasons.push(`runtimeLine 不等：壳 ${shell.runtimeLine} vs 包 ${bundle.runtimeLine}`);
  }
  if (!semverGte(shell.label, bundle.shellMin)) {
    reasons.push(`壳版本 < shellMin ${bundle.shellMin}`);
  }
  const missing = bundle.needs.filter((n) => !shell.provides.includes(n));
  if (missing.length) reasons.push(`壳缺少能力: ${missing.join(", ")}`);
  return { ok: reasons.length === 0, reasons, missing };
}

function resolvePeerOnShell(world, shellDig, dep) {
  // Find OTA or embedded bundle for toModule on this shell
  const slot = world.fleet[shellDig]?.[dep.toModule];
  if (!slot) return { ok: false, reason: `壳上无 ${dep.toModule} 槽位` };
  const dig = slot.ota || slot.embedded;
  if (!dig) return { ok: false, reason: `${dep.toModule} 未安装` };
  const b = world.bundles.find((x) => x.digest === dig);
  // naive range check: parse >=X
  const m = (dep.toRange || "").match(/>=?\s*([\d.]+)/);
  if (m && b && !semverGte(b.label, m[1])) {
    return { ok: false, reason: `${b.label} 不满足 ${dep.toRange}`, digest: dig };
  }
  return { ok: true, digest: dig, label: b?.label };
}

/** Three gates */
function gatePublish(world, bundleDig) {
  const b = world.bundles.find((x) => x.digest === bundleDig);
  const checks = [];
  // hard contract deps must exist in registry
  world.bundleDeps
    .filter((d) => d.from === bundleDig && d.to)
    .forEach((d) => {
      const target = world.bundles.find((x) => x.digest === d.to);
      const pass = !!target;
      checks.push({
        gate: "publish",
        strength: d.strength,
        pass: d.strength === STRENGTH.soft ? true : pass,
        warn: d.strength === STRENGTH.soft && !pass,
        msg: pass
          ? `合同依赖 ${d.to} 已在 registry`
          : `缺少合同包 ${d.to}（${d.reason}）`,
      });
    });
  checks.push({
    gate: "publish",
    strength: STRENGTH.hard,
    pass: !!b.runtimeLine && b.needs.length >= 0,
    msg: `已声明 runtimeLine=${b.runtimeLine} · needs=[${b.needs.join(", ")}]`,
  });
  return checks;
}

function gatePromote(world, bundleDig, shellDig) {
  const b = world.bundles.find((x) => x.digest === bundleDig);
  const s = world.shells.find((x) => x.digest === shellDig);
  const checks = [];
  const c = shellBundleCompat(s, b);
  checks.push({
    gate: "promote",
    strength: STRENGTH.hard,
    pass: c.ok,
    msg: c.ok ? `壳↔包能力闭合` : c.reasons.join("；"),
  });
  world.bundleDeps
    .filter((d) => d.from === bundleDig)
    .forEach((d) => {
      if (d.toModule) {
        const peer = resolvePeerOnShell(world, shellDig, d);
        const pass = d.strength === STRENGTH.soft ? true : peer.ok;
        checks.push({
          gate: "promote",
          strength: d.strength,
          pass,
          warn: d.strength === STRENGTH.soft && !peer.ok,
          msg: peer.ok
            ? `peer ${d.toModule} OK → ${peer.label || peer.digest}`
            : `peer 失败: ${peer.reason}（${d.reason}）`,
        });
      }
      if (d.to && d.kind === "hint" && d.strength === STRENGTH.soft) {
        checks.push({
          gate: "promote",
          strength: STRENGTH.soft,
          pass: true,
          warn: true,
          msg: `告警：${d.reason}`,
        });
      }
    });
  return checks;
}

function gateBundleLoad(world, shellDig, composition) {
  // composition: { checkout: digest, home: digest }
  const s = world.shells.find((x) => x.digest === shellDig);
  const checks = [];
  Object.entries(composition).forEach(([mod, dig]) => {
    if (!dig) return;
    const b = world.bundles.find((x) => x.digest === dig);
    const c = shellBundleCompat(s, b);
    checks.push({
      gate: "runtime",
      strength: STRENGTH.hard,
      pass: c.ok,
      msg: c.ok ? `load ${mod} OK` : `拒绝 load ${mod}: ${c.reasons.join("；")}`,
    });
  });
  // peer among composition
  Object.values(composition).forEach((dig) => {
    if (!dig) return;
    world.bundleDeps
      .filter((d) => d.from === dig && d.toModule)
      .forEach((d) => {
        const peerDig = composition[d.toModule];
        const peerB = world.bundles.find((x) => x.digest === peerDig);
        let ok = !!peerB;
        const m = (d.toRange || "").match(/>=?\s*([\d.]+)/);
        if (ok && m) ok = semverGte(peerB.label, m[1]);
        const pass = d.strength === STRENGTH.hard ? ok : d.strength === STRENGTH.peer ? ok : true;
        checks.push({
          gate: "runtime",
          strength: d.strength,
          pass,
          warn: d.strength !== STRENGTH.hard && !ok,
          msg: ok
            ? `runtime peer ${d.toModule} 满足`
            : `runtime peer 不满足 ${d.toModule} ${d.toRange || ""}`,
        });
      });
  });
  return checks;
}

let world = { platform: "android", shells: [], bundles: [], bundleDeps: [], fleet: {}, live: false };
let view = "compat-lines";
let focus = { type: "bundle", id: "js-chk-p184" };

function setDetail(html) {
  document.getElementById("detail").innerHTML = html;
}

function showChecks(title, checks) {
  const allHardPass = checks.filter((c) => c.strength === STRENGTH.hard).every((c) => c.pass);
  setDetail(`
    <div class="pill ${allHardPass ? "ok" : "bad"}">${allHardPass ? "HARD PASS" : "HARD FAIL"}</div>
    <p class="hint" style="margin-top:0.4rem">${title}</p>
    ${checks
      .map(
        (c) => `
      <div class="gate ${c.pass ? (c.warn ? "warn" : "pass") : "fail"}">
        <span class="pill ${c.strength}">${c.strength}</span>
        <span class="pill">${c.gate}</span>
        ${c.pass ? (c.warn ? "⚠" : "✓") : "✗"} ${c.msg}
      </div>`,
      )
      .join("")}
  `);
}

function compatLines() {
  // Aggregate: runtimeLine -> modules production bundles (active)
  const lines = {};
  world.bundles.forEach((b) => {
    if (!lines[b.runtimeLine]) lines[b.runtimeLine] = [];
    lines[b.runtimeLine].push(b);
  });
  const shellByLine = {};
  world.shells.forEach((s) => {
    if (!shellByLine[s.runtimeLine]) shellByLine[s.runtimeLine] = [];
    shellByLine[s.runtimeLine].push(s);
  });
  return { lines, shellByLine };
}

function renderCompatLines() {
  const { lines, shellByLine } = compatLines();
  return `
    <div class="grid3">
      <div class="stat"><div class="n">${Object.keys(lines).length}</div><div class="l">runtime / fingerprint 线</div></div>
      <div class="stat"><div class="n">${world.shells.filter((s) => s.kind === "production").length}</div><div class="l">生产壳版本（示意）</div></div>
      <div class="stat"><div class="n">${world.bundleDeps.length}</div><div class="l">已声明包↔包依赖</div></div>
    </div>
    <div class="card">
      <h3>兼容线表（工业默认首页）</h3>
      <p class="hint">不展开每个 digest 边。先选线，再看该线上的壳与包；依赖在邻域 / 门禁里查。</p>
      ${Object.keys(lines)
        .map((line) => {
          const shells = shellByLine[line] || [];
          const bundles = lines[line];
          const share = shells.reduce((s, x) => s + x.activeShare, 0);
          return `<div style="margin:0.75rem 0;padding:0.65rem;border:1px solid var(--line);border-radius:8px">
            <button data-line="${line}" style="width:auto"><strong>${line}</strong></button>
            <span class="hint">机群约占 ${(share * 100).toFixed(0)}%</span>
            <div class="hint" style="margin-top:0.35rem">壳：${shells.map((s) => s.label).join(" · ") || "—"}</div>
            <div class="hint">包：${bundles.map((b) => b.label).join(" · ")}</div>
          </div>`;
        })
        .join("")}
    </div>`;
}

function renderEgo() {
  const id = focus.id;
  const isShell = focus.type === "shell";
  const W = 720;
  const H = 340;
  let center, neighbors = [];

  if (isShell) {
    const s = world.shells.find((x) => x.digest === id);
    center = { label: s.label, kind: "shell" };
    world.bundles.forEach((b) => {
      const c = shellBundleCompat(s, b);
      if (c.ok || Object.values(world.fleet[s.digest] || {}).some((slot) => slot.embedded === b.digest || slot.ota === b.digest)) {
        neighbors.push({
          id: b.digest,
          label: b.label,
          kind: "bundle",
          edge: c.ok ? "compat" : "block",
        });
      }
    });
  } else {
    const b = world.bundles.find((x) => x.digest === id);
    center = { label: b.label, kind: "bundle" };
    world.shells.forEach((s) => {
      const c = shellBundleCompat(s, b);
      if (c.ok) neighbors.push({ id: s.digest, label: s.label, kind: "shell", edge: "compat" });
      else if (s.runtimeLine === b.runtimeLine) neighbors.push({ id: s.digest, label: s.label, kind: "shell", edge: "block" });
    });
    world.bundleDeps
      .filter((d) => d.from === id)
      .forEach((d) => {
        if (d.to) {
          const t = world.bundles.find((x) => x.digest === d.to);
          neighbors.push({ id: d.to, label: t.label, kind: "bundle", edge: d.strength });
        } else if (d.toModule) {
          neighbors.push({
            id: "mod:" + d.toModule,
            label: `${d.toModule} ${d.toRange}`,
            kind: "peer",
            edge: d.strength,
          });
        }
      });
  }

  const cx = 160;
  const cy = H / 2;
  const nx = 520;
  const nodes = neighbors
    .map((n, i) => {
      const y = 40 + (i * (H - 60)) / Math.max(neighbors.length - 1, 1);
      const color =
        n.edge === "hard"
          ? "var(--hard)"
          : n.edge === "peer"
            ? "var(--peer)"
            : n.edge === "soft"
              ? "var(--soft)"
              : n.edge === "block"
                ? "var(--danger)"
                : "var(--ok)";
      return `
        <path d="M ${cx + 70} ${cy} C 300 ${cy}, 400 ${y}, ${nx - 70} ${y}" fill="none" stroke="${color}" stroke-width="1.8"/>
        <g data-ego="${n.id}" data-kind="${n.kind}" style="cursor:pointer">
          <rect x="${nx - 70}" y="${y - 16}" width="140" height="32" rx="6" fill="#1a2330" stroke="${color}"/>
          <text x="${nx}" y="${y + 4}" text-anchor="middle" fill="#e8eef5" font-size="10">${n.label}</text>
        </g>`;
    })
    .join("");

  return `
    <div class="card">
      <h3>邻域图 · 仅 1 跳（Backstage 式）</h3>
      <div class="row-actions">
        ${world.bundles
          .slice(0, 4)
          .map(
            (b) =>
              `<button data-focus-b="${b.digest}" class="${focus.type === "bundle" && focus.id === b.digest ? "active" : ""}">${b.label}</button>`,
          )
          .join("")}
        ${world.shells
          .map(
            (s) =>
              `<button data-focus-s="${s.digest}" class="${focus.type === "shell" && focus.id === s.digest ? "active" : ""}">${s.label}</button>`,
          )
          .join("")}
      </div>
      <svg id="ego" viewBox="0 0 ${W} ${H}">
        <rect x="${cx - 70}" y="${cy - 20}" width="140" height="40" rx="8" fill="#221a2a" stroke="#9b7bb8"/>
        <text x="${cx}" y="${cy + 5}" text-anchor="middle" fill="#fff" font-size="12">${center.label}</text>
        ${nodes}
      </svg>
      <p class="hint">边颜色：绿兼容 · 红阻断/hard · 蓝 peer · 黄 soft。不渲染全库。</p>
    </div>`;
}

function renderPkgDeps() {
  return `
    <div class="card">
      <h3>包 ↔ 包依赖（清单声明）</h3>
      <p class="hint">ADR-007：业务包<strong>不应</strong>同步 import 另一业务包 JS。推荐 hard→合同包；peer→同壳 module 版本域；digest 级互绑仅 soft 告警。</p>
      <table>
        <thead><tr><th>from</th><th>to</th><th>强度</th><th>类型</th><th>约束</th><th>原因</th></tr></thead>
        <tbody>
          ${world.bundleDeps
            .map((d) => {
              const from = world.bundles.find((b) => b.digest === d.from);
              const to = d.to
                ? world.bundles.find((b) => b.digest === d.to)?.label
                : `${d.toModule} ${d.toRange}`;
              return `<tr data-from="${d.from}">
                <td>${from.label}</td>
                <td>${to}</td>
                <td><span class="pill ${d.strength}">${d.strength}</span></td>
                <td>${d.kind}</td>
                <td class="mono">${d.range || d.toRange || "—"}</td>
                <td class="hint">${d.reason}</td>
              </tr>`;
            })
            .join("")}
        </tbody>
      </table>
    </div>
    <div class="grid2">
      <div class="card">
        <h3>如何处理</h3>
        <ul class="compact">
          <li><strong>hard + contract</strong>：publish/promote 缺目标则失败</li>
          <li><strong>peer + coexistence</strong>：按「同壳上另一 module 的当前包」校验版本域，不锁死 digest</li>
          <li><strong>soft</strong>：告警、报表、可破例；不挡加载</li>
          <li><strong>禁止默认</strong>：业务包 A hard 依赖业务包 B 的具体 digest（双列车无法独立灰度）</li>
        </ul>
      </div>
      <div class="card">
        <h3>与通信的关系（ADR-007）</h3>
        <ul class="compact">
          <li>运行时协作走 <strong>ShellBus</strong> / 能力 API，不是 bundle require</li>
          <li>DTO/topic 版本进 <strong>shared-contract</strong> 包（可版本化、可门禁）</li>
          <li>观测带 business_module + update_id，便于归因</li>
        </ul>
      </div>
    </div>`;
}

function renderShellDeps() {
  return `
    <div class="card">
      <h3>壳 ↔ 包依赖 = 能力闭合（不是「安装依赖树」）</h3>
      <p class="hint">包声明 needs[]；壳声明 provides[]；再加 runtimeLine + shellMin。矩阵按<strong>兼容线聚合</strong>时可再下钻。</p>
      <table>
        <thead>
          <tr>
            <th>壳 \\ 包</th>
            ${world.bundles
              .filter((b) => b.module !== "shared-contract")
              .map((b) => `<th>${b.label}</th>`)
              .join("")}
          </tr>
        </thead>
        <tbody>
          ${world.shells
            .map((s) => {
              return `<tr>
                <td><span class="pill shell">${s.label}</span><div class="mono hint">${s.runtimeLine}</div></td>
                ${world.bundles
                  .filter((b) => b.module !== "shared-contract")
                  .map((b) => {
                    const c = shellBundleCompat(s, b);
                    return `<td data-s="${s.digest}" data-b="${b.digest}">${
                      c.ok ? '<span class="pill ok">可承载</span>' : '<span class="pill bad">阻断</span>'
                    }</td>`;
                  })
                  .join("")}
              </tr>`;
            })
            .join("")}
        </tbody>
      </table>
    </div>`;
}

function renderGates() {
  const shell = world.shells[0];
  const bundle =
    world.bundles.find((b) => b.kind === "test") ||
    world.bundles.find((b) => b.kind === "production") ||
    world.bundles[0];
  const shellList = world.shells.map((s) => `${s.label}: ${s.provides.length ? s.provides.join(", ") : "（registry 未声明能力）"}`).join("</li><li>") || "—";
  const bundleList = world.bundles.map((b) => `${b.label} (${b.module})`).join("</li><li>") || "—";
  return `
    <div class="card">
      <h3>三道门禁演练</h3>
      <p class="hint">${world.live ? world.apiMsg || "数据来自分发 API" : "演示模式 — registry 未加载"}</p>
      <div class="row-actions">
        <button class="primary" id="g-pub-ok" ${bundle ? "" : "disabled"}>1. publish 首包</button>
        <button id="g-promo-fail" ${bundle && world.shells[1] ? "" : "disabled"}>2. promote → 第二壳</button>
        <button id="g-promo-ok" ${bundle && world.shells[world.shells.length - 1] ? "" : "disabled"}>3. promote → 末壳</button>
      </div>
      <div class="grid2" style="margin-top:0.75rem">
        <div>
          <h3>壳（registry）</h3>
          <ul class="compact"><li>${shellList}</li></ul>
        </div>
        <div>
          <h3>包（registry）</h3>
          <ul class="compact"><li>${bundleList}</li></ul>
        </div>
      </div>
    </div>`;
}

function renderAdvanced() {
  return `
    <div class="card">
      <h3>全量图（审计 / 高级）</h3>
      <p class="hint">保留给审计与事故复盘。默认产品路径请用兼容线 + 邻域。节点多时请按 runtimeLine / module 过滤（此处仅说明，不渲染力导向全图）。</p>
      <ul class="compact">
        <li>壳 ${world.shells.length} · 包 ${world.bundles.length} · 包依赖声明 ${world.bundleDeps.length}</li>
        <li>若画全量二分：边数 ≈ 壳×包 + 包依赖，长期迭代后不可读</li>
        <li>导出：Cypher / JSON 清单给安全与架构，不进日常控制台首页</li>
      </ul>
      <a href="./shell-bundle-relation.html"><button type="button">打开旧版全量关系沙盘（对照）</button></a>
    </div>`;
}

function render() {
  const banner = document.getElementById("live-banner");
  if (banner) {
    banner.textContent = world.live
      ? world.apiMsg || "数据来自分发 API"
      : world.apiError
        ? `registry 加载失败：${world.apiError}`
        : "正在加载 registry…";
  }
  document.querySelectorAll(".side > button[data-view]").forEach((b) => {
    b.classList.toggle("active", b.dataset.view === view);
  });
  document.getElementById("plat-android").classList.toggle("active", world.platform === "android");
  document.getElementById("plat-ios").classList.toggle("active", world.platform === "ios");

  const root = document.getElementById("view-root");
  if (view === "compat-lines") root.innerHTML = renderCompatLines();
  else if (view === "ego") root.innerHTML = renderEgo();
  else if (view === "pkg-deps") root.innerHTML = renderPkgDeps();
  else if (view === "shell-deps") root.innerHTML = renderShellDeps();
  else if (view === "gates") root.innerHTML = renderGates();
  else root.innerHTML = renderAdvanced();

  root.querySelectorAll("[data-line]").forEach((b) => {
    b.onclick = () => {
      const line = b.dataset.line;
      const shells = world.shells.filter((s) => s.runtimeLine === line);
      const bundles = world.bundles.filter((x) => x.runtimeLine === line);
      setDetail(`
        <div class="pill ok">兼容线</div>
        <div class="kv" style="margin-top:0.5rem">
          <div class="k">line</div><div class="v">${line}</div>
          <div class="k">壳</div><div class="v">${shells.map((s) => s.label).join(", ")}</div>
          <div class="k">包</div><div class="v">${bundles.map((x) => x.label).join(", ")}</div>
        </div>
        <p class="hint">跨线 = 硬不兼容。线内仍要查 shellMin / native / peer。</p>
        <button id="ego-from-line" class="primary" style="margin-top:0.5rem">用该线首包打开邻域</button>
      `);
      document.getElementById("ego-from-line").onclick = () => {
        focus = { type: "bundle", id: bundles[0].digest };
        view = "ego";
        render();
      };
    };
  });

  root.querySelectorAll("[data-focus-b]").forEach((b) => {
    b.onclick = () => {
      focus = { type: "bundle", id: b.dataset.focusB };
      render();
      const bundle = world.bundles.find((x) => x.digest === focus.id);
      setDetail(`<div class="pill bundle">包</div><div class="kv" style="margin-top:0.4rem">
        <div class="k">label</div><div class="v">${bundle.label}</div>
        <div class="k">needs</div><div class="v">${bundle.needs.join(", ")}</div>
        <div class="k">line</div><div class="v">${bundle.runtimeLine}</div>
      </div>`);
    };
  });
  root.querySelectorAll("[data-focus-s]").forEach((b) => {
    b.onclick = () => {
      focus = { type: "shell", id: b.dataset.focusS };
      render();
    };
  });
  root.querySelectorAll("[data-ego]").forEach((g) => {
    g.onclick = () => {
      const kind = g.dataset.kind;
      const id = g.dataset.ego;
      if (kind === "shell") focus = { type: "shell", id };
      else if (kind === "bundle") focus = { type: "bundle", id };
      render();
    };
  });
  root.querySelectorAll("[data-from]").forEach((tr) => {
    tr.onclick = () => {
      focus = { type: "bundle", id: tr.dataset.from };
      showChecks("publish 预检", gatePublish(world, tr.dataset.from));
    };
  });
  root.querySelectorAll("[data-s]").forEach((td) => {
    td.onclick = () => {
      showChecks(
        `promote 预检 ${td.dataset.b} → ${td.dataset.s}`,
        gatePromote(world, td.dataset.b, td.dataset.s),
      );
    };
  });

  const bind = (id, fn) => {
    const el = document.getElementById(id);
    if (el) el.onclick = fn;
  };
  bind("g-pub-ok", () => {
    const b = world.bundles[0];
    if (b) showChecks(`publish ${b.label}`, gatePublish(world, b.digest));
  });
  bind("g-promo-fail", () => {
    const b = world.bundles.find((x) => x.kind === "test") || world.bundles[0];
    const s = world.shells[1];
    if (b && s) showChecks(`promote ${b.label} → ${s.label}`, gatePromote(world, b.digest, s.digest));
  });
  bind("g-promo-ok", () => {
    const b = world.bundles.find((x) => x.kind === "test") || world.bundles[0];
    const s = world.shells[world.shells.length - 1];
    if (b && s) showChecks(`promote ${b.label} → ${s.label}`, gatePromote(world, b.digest, s.digest));
  });
}

document.querySelectorAll(".side > button[data-view]").forEach((b) => {
  b.onclick = () => {
    view = b.dataset.view;
    render();
  };
});
async function loadWorld(platform) {
  try {
    return await PortalLive.hydrateRelationWorld(platform);
  } catch (err) {
    const demo = seed(platform);
    demo.live = false;
    demo.apiError = err.message || String(err);
    return demo;
  }
}

document.getElementById("plat-android").onclick = async () => {
  world = await loadWorld("android");
  render();
};
document.getElementById("plat-ios").onclick = async () => {
  world = await loadWorld("ios");
  render();
};

(async () => {
  world = await loadWorld("android");
  render();
  setDetail(`<p class="hint">会有依赖，但分两类处理：壳↔包=能力闭合；包↔包=合同/peer，禁止业务 digest 硬绑。打开「三道门禁演练」看 fail-closed。</p>`);
})();
  </script>
</body>
