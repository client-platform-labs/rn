<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rn-delivery · Control Plane (thin)</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e7ecf1;
      --muted: #8b9aab;
      --line: #2a3542;
      --ok: #3d9a6a;
      --warn: #c4a035;
      --danger: #c45c5c;
      --accent: #4a8fd4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }
    main {
      display: grid;
      gap: 1rem;
      padding: 1rem 1.5rem 2rem;
      max-width: 1100px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    button, .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
    }
    button:hover { border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.danger { border-color: var(--danger); color: #f0c0c0; }
    input.token {
      min-width: 12rem;
      padding: 0.35rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    input.token {
      min-width: 12rem;
      padding: 0.35rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    .status {
      color: var(--muted);
      font-size: 0.8rem;
      margin-left: auto;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    section h2 {
      margin: 0;
      padding: 0.65rem 0.9rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 0.55rem 0.9rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      font-size: 0.85rem;
    }
    th { color: var(--muted); font-weight: 500; }
    tr:last-child td { border-bottom: 0; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      word-break: break-all;
    }
    .tag {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      font-size: 0.72rem;
      background: #243040;
      color: var(--muted);
    }
    .empty {
      padding: 1rem 0.9rem;
      color: var(--muted);
    }
    .err {
      color: var(--danger);
      padding: 0.5rem 0.9rem;
      font-size: 0.85rem;
    }
    .actions { white-space: nowrap; }
    .actions button { margin-right: 0.25rem; }
  </style>
</head>
<body>
  <header>
    <h1>Control Plane · thin demo</h1>
    <p>Reads <code>.rn/delivery/registry.json</code> via the same HTTP API as CLI. Set <code>RN_CP_TOKEN</code> on serve for mutating routes.</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" class="primary" id="btn-refresh">Refresh</button>
      <label>
        <span class="status">CP token</span>
        <input class="token" id="cp-token" type="password" placeholder="Bearer (RN_CP_TOKEN)" autocomplete="off" />
      </label>
      <span class="status" id="status">loading…</span>
    </div>
    <div id="error" class="err" hidden></div>
    <section>
      <h2>Staging</h2>
      <div id="staging"></div>
    </section>
    <section>
      <h2>Production</h2>
      <div id="production"></div>
    </section>
    <section>
      <h2>Blocked</h2>
      <div id="blocked"></div>
    </section>
    <section>
      <h2>Kills · Pauses (B9 · by business_module)</h2>
      <div id="kills-pauses"></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const short = (d) => (d ? d.slice(0, 12) + "…" : "—");
    const TOKEN_KEY = "rn_cp_token";

    $("cp-token").value = sessionStorage.getItem(TOKEN_KEY) || "";
    $("cp-token").addEventListener("change", (ev) => {
      sessionStorage.setItem(TOKEN_KEY, ev.target.value.trim());
    });

    function authHeaders() {
      const token = ($("cp-token").value || sessionStorage.getItem(TOKEN_KEY) || "").trim();
      const headers = { "content-type": "application/json" };
      if (token) headers.authorization = `Bearer ${token}`;
      return headers;
    }

    function showError(msg) {
      const el = $("error");
      if (!msg) { el.hidden = true; el.textContent = ""; return; }
      el.hidden = false;
      el.textContent = msg;
    }

    function rowActions(c, lane) {
      const digest = c.digest;
      const mod = c.business_module || "";
      const uid = c.update_id || "";
      const promote =
        lane === "staging"
          ? `<button type="button" data-act="promote" data-digest="${digest}">Promote</button>`
          : "";
      const kill =
        mod && uid
          ? `<button type="button" class="danger" data-act="kill" data-module="${mod}" data-update="${uid}">Kill</button>`
          : "";
      const pause = mod
        ? `<button type="button" data-act="pause" data-module="${mod}">Pause</button>`
        : "";
      return `${promote}<button type="button" class="danger" data-act="block" data-digest="${digest}">Block</button>${kill}${pause}`;
    }

    function renderCandidates(el, list, lane) {
      if (!list || list.length === 0) {
        el.innerHTML = `<div class="empty">empty</div>`;
        return;
      }
      const body = list
        .map(
          (c) => `<tr>
            <td><code title="${c.digest}">${short(c.digest)}</code></td>
            <td><span class="tag">${c.artifact_kind || "—"}</span></td>
            <td>${c.business_module || c.platform || "—"}</td>
            <td>${c.update_id || c.release_id || "—"}</td>
            <td class="actions">${rowActions(c, lane)}</td>
          </tr>`,
        )
        .join("");
      el.innerHTML = `<table>
        <thead><tr><th>digest</th><th>kind</th><th>module / platform</th><th>id</th><th></th></tr></thead>
        <tbody>${body}</tbody>
      </table>`;
    }

    function renderBlocked(el, list) {
      if (!list || list.length === 0) {
        el.innerHTML = `<div class="empty">empty</div>`;
        return;
      }
      const body = list
        .map(
          (b) => `<tr>
            <td><code>${short(b.digest)}</code></td>
            <td>${b.reason || "—"}</td>
            <td>${b.blocked_at || "—"}</td>
          </tr>`,
        )
        .join("");
      el.innerHTML = `<table>
        <thead><tr><th>digest</th><th>reason</th><th>at</th></tr></thead>
        <tbody>${body}</tbody>
      </table>`;
    }

    function renderKillsPauses(el, data) {
      const kills = data.kills || [];
      const pauses = data.pauses || [];
      if (kills.length === 0 && pauses.length === 0) {
        el.innerHTML = `<div class="empty">empty — Kill / Pause from candidate rows</div>`;
        return;
      }
      const killRows = kills
        .map(
          (k) => `<tr>
            <td><span class="tag">kill</span> ${k.business_module}</td>
            <td><code>${(k.update_ids || []).join(", ")}</code></td>
            <td>${k.reason || "—"} · ${k.killed_at || ""}</td>
          </tr>`,
        )
        .join("");
      const pauseRows = pauses
        .map(
          (p) => `<tr>
            <td><span class="tag">pause</span> ${p.business_module}</td>
            <td>${p.reason || "—"}</td>
            <td class="actions">
              <button type="button" data-act="resume" data-module="${p.business_module}">Resume</button>
              · ${p.paused_at || ""}
            </td>
          </tr>`,
        )
        .join("");
      el.innerHTML = `<table>
        <thead><tr><th>module</th><th>detail</th><th></th></tr></thead>
        <tbody>${killRows}${pauseRows}</tbody>
      </table>`;
    }

    async function load() {
      $("status").textContent = "loading…";
      showError("");
      try {
        const res = await fetch("/v1/registry");
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        renderCandidates($("staging"), data.staging, "staging");
        renderCandidates($("production"), data.production, "production");
        renderBlocked($("blocked"), data.blocked);
        renderKillsPauses($("kills-pauses"), data);
        $("status").textContent =
          `staging ${data.staging?.length ?? 0} · production ${data.production?.length ?? 0} · blocked ${data.blocked?.length ?? 0} · kills ${data.kills?.length ?? 0} · pauses ${data.pauses?.length ?? 0}`;
      } catch (err) {
        showError(String(err.message || err));
        $("status").textContent = "error";
      }
    }

    async function post(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    document.body.addEventListener("click", async (ev) => {
      const btn = ev.target.closest("button[data-act]");
      if (!btn) return;
      const act = btn.getAttribute("data-act");
      const digest = btn.getAttribute("data-digest");
      const mod = btn.getAttribute("data-module");
      const updateId = btn.getAttribute("data-update");
      try {
        showError("");
        if (act === "promote") {
          await post("/v1/promote", { digest });
        } else if (act === "block") {
          const reason = prompt("Block reason", "cp-web demo block") || "cp-web demo block";
          await post("/v1/block", { digest, reason });
        } else if (act === "kill") {
          const reason = prompt("Kill reason", "cp-web kill") || "cp-web kill";
          await post("/v1/kill", {
            business_module: mod,
            update_ids: [updateId],
            reason,
          });
        } else if (act === "pause") {
          const reason = prompt("Pause reason", "cp-web pause") || "cp-web pause";
          await post("/v1/pause", { business_module: mod, reason });
        } else if (act === "resume") {
          await post("/v1/resume", { business_module: mod });
        }
        await load();
      } catch (err) {
        showError(String(err.message || err));
      }
    });

    $("btn-refresh").addEventListener("click", load);
    load();
  </script>
</body>
</html>
