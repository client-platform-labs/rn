# Map B B6 — RnModuleStub.xcframework binary build (macos + full Xcode only).
# Separate from linux CI so main ci.yml stays fast.
name: XCFramework

on:
  pull_request:
    paths:
      - "examples/brownfield-host/ios/**"
      - "scripts/build-bf-rn-module-xcframework.sh"
      - "scripts/verify-bf-xcframework-build.mjs"
      - ".github/workflows/xcframework.yml"
  push:
    branches: [main]
    paths:
      - "examples/brownfield-host/ios/**"
      - "scripts/build-bf-rn-module-xcframework.sh"
      - "scripts/verify-bf-xcframework-build.mjs"
      - ".github/workflows/xcframework.yml"

jobs:
  build-xcframework:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build and verify RnModuleStub.xcframework
        run: node scripts/verify-bf-xcframework-build.mjs
