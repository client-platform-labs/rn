name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/check-architecture-governance.mjs
      # #256: the verification plane's own gate. Catches the classes where a check
      # "looked like it verified" but could not: a test file that no glob expands,
      # an e2e chain that can exit 0 after a SKIP, a step the operator is told to
      # run that does not exist, and a probe referenced but absent on disk.
      - run: node scripts/check-verification-plane.mjs
      # #259: the fixture harness's own probe. It lives in scripts/, not in any
      # package test glob, so it must be invoked explicitly or it is unenforced
      # (and it honestly listed itself as an orphan until this line existed).
      - run: node scripts/_run-verify.mjs harness
      - run: node scripts/verify-cp-stub-api.mjs
      - run: node scripts/verify-cp-enterprise.mjs
      - run: node scripts/verify-distribution-console.mjs
      # ADR-014: the DR backup/restore must fail closed — a backup whose selected
      # registry backend is absent, or a restore of an archive that captured no
      # registry, must error instead of reporting success. Hermetic probe.
      - run: node scripts/verify-dr-backup-fail-closed.mjs
      - run: node scripts/run-afk-hitl-loop.mjs --mode afk --plan
      - run: node scripts/run-afk-hitl-loop.mjs --mode afk
      - run: pnpm exec rn doctor
      - run: pnpm exec rn init --dry-run
      - run: pnpm exec rn plugin list

  release-readiness:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bash scripts/release-readiness/run-all.sh --max 05